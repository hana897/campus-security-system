<!DOCTYPE html>
<html>

<head>
    <title>Campus Security Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f7;
        }

        .login-box{

            width:350px;

            margin:100px auto;

            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0 0 10px gray;

        }

        h2{
            text-align:center;
        }

        input{

            width:100%;

            padding:10px;

            margin:10px 0;

            box-sizing:border-box;

        }

        button{

            width:100%;

            padding:10px;

            background:#007bff;

            color:white;

            border:none;

            cursor:pointer;

            font-size:16px;

        }

    </style>

</head>

<body>

<div class="login-box">

<h2>Campus Security System</h2>

<form method="POST" autocomplete="off">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>


</div>

</body>

</html>
