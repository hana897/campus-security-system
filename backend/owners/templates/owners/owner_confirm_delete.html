{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h3>Delete Owner</h3>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete <strong>{{ owner.full_name }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'owner_detail' owner.id %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
